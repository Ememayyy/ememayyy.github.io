<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CodeForge — Competitive Programming Platform</title>
<style>
:root{
 --bg:#090b12;--panel:#111522;--panel2:#171b2a;--text:#eef2ff;--muted:#8e98b8;
 --primary:#7c5cff;--primary2:#4cc9f0;--green:#38d996;--red:#ff5c7a;--yellow:#ffc857;
 --border:#252b40;--shadow:0 18px 60px #0007;
}
[data-theme="light"]{
 --bg:#f4f6fb;--panel:#fff;--panel2:#eef1f8;--text:#151827;--muted:#64708d;
 --primary:#6346e8;--primary2:#0795c7;--green:#099c68;--red:#dc3154;--yellow:#c88700;
 --border:#dce1ed;--shadow:0 15px 40px #26345a18;
}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#2d1f6b44,transparent 35%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{height:70px;display:flex;align-items:center;gap:18px;padding:0 28px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}
.logo{font-size:22px;font-weight:900;letter-spacing:-1px;cursor:pointer}.logo b{color:var(--primary)}
.nav{display:flex;gap:5px;flex:1}.nav button,.ghost{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:10px}.nav button:hover,.nav .active,.ghost:hover{background:var(--panel2);color:var(--text)}
.actions{display:flex;align-items:center;gap:8px}.icon{width:40px;height:40px;padding:0;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:12px}
.btn{border:0;background:linear-gradient(135deg,var(--primary),#9b68ff);color:#fff;padding:11px 17px;border-radius:11px;font-weight:800;box-shadow:0 8px 24px #7658ff25}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);box-shadow:none}.btn.danger{background:var(--red)}
.wrap{max-width:1280px;margin:auto;padding:30px 22px 70px}.hero{padding:42px 0 28px;display:grid;grid-template-columns:1.4fr .8fr;gap:30px;align-items:center}.hero h1{font-size:clamp(38px,6vw,70px);line-height:.98;margin:0 0 18px;letter-spacing:-3px}.gradient{background:linear-gradient(90deg,var(--primary),var(--primary2));-webkit-background-clip:text;color:transparent}.hero p{font-size:18px;color:var(--muted);max-width:700px}.hero-card{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--border);padding:22px;border-radius:22px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:19px;box-shadow:var(--shadow)}
.stat{font-size:31px;font-weight:900}.muted{color:var(--muted)}.small{font-size:13px}.tag{display:inline-flex;padding:4px 8px;border-radius:8px;background:var(--panel2);color:var(--muted);font-size:12px;margin:3px}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}
table{width:100%;border-collapse:collapse}th,td{padding:13px 11px;border-bottom:1px solid var(--border);text-align:left}th{color:var(--muted);font-size:12px;text-transform:uppercase}.table-wrap{overflow:auto}
input,textarea,select{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:var(--primary)}textarea{min-height:120px;resize:vertical}.form{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.section{margin-top:28px}.section h2{margin:0 0 14px}.pill{padding:5px 9px;border-radius:99px;background:var(--panel2);font-size:12px}.rating{font-weight:900;color:var(--yellow)}
.problem{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center}.problem h3{margin:0 0 6px}.contest{position:relative;overflow:hidden}.contest:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--primary),var(--primary2))}
.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:100;padding:20px}.modal.show{display:grid}.modal-box{width:min(520px,100%);background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:var(--shadow)}
.toast{position:fixed;right:20px;bottom:20px;padding:13px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;display:none;z-index:200}.toast.show{display:block}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#070910;color:#dbe3ff;padding:16px;border-radius:12px;white-space:pre-wrap;max-height:260px;overflow:auto}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;font-size:12px;font-weight:800}.badge.ok{background:#38d99618;color:var(--green)}.badge.wa{background:#ff5c7a18;color:var(--red)}.badge.info{background:#7c5cff18;color:var(--primary)}
.empty{text-align:center;padding:40px;color:var(--muted)}.hidden{display:none!important}
@media(max-width:850px){.hero{grid-template-columns:1fr}.grid,.grid2{grid-template-columns:1fr}.nav{display:none}.top{padding:0 14px}.wrap{padding:20px 14px}}
</style>
</head>
<body>
<header class="top">
 <div class="logo" onclick="go('home')">Code<b>Forge</b></div>
 <nav class="nav" id="nav"></nav>
 <div class="actions">
  <button class="icon" onclick="toggleTheme()" title="Theme">◐</button>
  <span id="userArea"></span>
 </div>
</header>
<main class="wrap" id="app"></main>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='codeforge_db_v1';
const defaultDB={
 users:[
  {id:1,handle:'admin',email:'admin@codeforge.local',password:'admin123',rating:2400,role:'admin',solved:42},
  {id:2,handle:'tourist',email:'tourist@codeforge.local',password:'123456',rating:1900,role:'user',solved:18},
  {id:3,handle:'newbie',email:'newbie@codeforge.local',password:'123456',rating:800,role:'user',solved:2}
 ],
 problems:[
  {id:1,code:'A',title:'Two Numbers',rating:800,tags:'math,implementation',statement:'Given two integers a and b, print their sum.',answer:'sum'},
  {id:2,code:'B',title:'Array Balance',rating:1100,tags:'greedy,arrays',statement:'Find whether an array can be balanced by moving one unit between elements.',answer:'balance'},
  {id:3,code:'C',title:'Graph Paths',rating:1500,tags:'graphs,bfs',statement:'Find the shortest path from vertex 1 to every other vertex.',answer:'bfs'},
  {id:4,code:'D',title:'Dynamic Queries',rating:1900,tags:'data structures,segment tree',statement:'Process point updates and range sum queries.',answer:'seg'}
 ],
 contests:[
  {id:1,name:'CodeForge Round #1',phase:'finished',duration:120,start:'2026-08-05T18:00',problems:[1,2,3],participants:[2,3]},
  {id:2,name:'CodeForge Weekly #2',phase:'upcoming',duration:150,start:'2026-08-15T18:00',problems:[1,2,3,4],participants:[2]}
 ],
 submissions:[
  {id:1,user:2,problem:1,verdict:'Accepted',time:'2026-08-10 19:20',lang:'GNU C++20'},
  {id:2,user:2,problem:2,verdict:'Accepted',time:'2026-08-10 19:32',lang:'GNU C++20'},
  {id:3,user:3,problem:1,verdict:'Wrong Answer',time:'2026-08-11 17:10',lang:'GNU C++20'}
 ]
};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||defaultDB;
let current=JSON.parse(localStorage.getItem('cf_session')||'null');
let page='home';
let selectedContest=null, selectedProblem=null;

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function me(){return current&&db.users.find(x=>x.id===current.id)}
function isAdmin(){return me()?.role==='admin'}
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function go(p){page=p;render()}
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'':'light';localStorage.setItem('theme',document.documentElement.dataset.theme)}
if(localStorage.getItem('theme'))document.documentElement.dataset.theme=localStorage.getItem('theme');

function renderNav(){
 const links=[['home','Home'],['problems','Problems'],['contests','Contests'],['standings','Standings'],['submissions','Submissions']];
 if(isAdmin())links.push(['admin','Admin']);
 document.getElementById('nav').innerHTML=links.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
 document.getElementById('userArea').innerHTML=me()?`<button class="ghost" onclick="go('profile')">⚡ ${esc(me().handle)} <span class="rating">${me().rating}</span></button><button class="btn secondary" onclick="logout()">Logout</button>`:`<button class="btn secondary" onclick="openAuth('login')">Login</button><button class="btn" onclick="openAuth('register')">Sign up</button>`;
}
function render(){renderNav();let a=document.getElementById('app');if(page==='home')a.innerHTML=home();else if(page==='problems')a.innerHTML=problems();else if(page==='contests')a.innerHTML=contests();else if(page==='standings')a.innerHTML=standings();else if(page==='submissions')a.innerHTML=submissions();else if(page==='profile')a.innerHTML=profile();else if(page==='problem')a.innerHTML=problemPage();else if(page==='contest')a.innerHTML=contestPage();else if(page==='admin')a.innerHTML=admin();}

function home(){return `<section class="hero"><div><div class="pill">⚡ NEXT-GEN COMPETITIVE PROGRAMMING</div><h1>Code. Compete.<br><span class="gradient">Forge your rating.</span></h1><p>A full competitive-programming playground with contests, submissions, standings, rating, authentication and an admin control center — all running locally in your browser.</p><div class="row"><button class="btn" onclick="go('contests')">Explore contests →</button><button class="btn secondary" onclick="go('problems')">Solve problems</button></div></div><div class="hero-card"><div class="muted small">LIVE PLATFORM</div><h2 style="font-size:34px;margin:8px 0">Everything in one place.</h2><div class="grid2"><div><div class="stat">${db.problems.length}</div><div class="muted">Problems</div></div><div><div class="stat">${db.users.length}</div><div class="muted">Coders</div></div><div><div class="stat">${db.contests.length}</div><div class="muted">Contests</div></div><div><div class="stat">${db.submissions.length}</div><div class="muted">Submissions</div></div></div></div></section>
<section class="section"><h2>Featured contests</h2><div class="grid">${db.contests.map(c=>contestCard(c)).join('')}</div></section>
<section class="section"><h2>Popular problems</h2><div class="card table-wrap"><table><thead><tr><th>#</th><th>Problem</th><th>Rating</th><th>Tags</th></tr></thead><tbody>${db.problems.slice(0,6).map(p=>`<tr onclick="openProblem(${p.id})" style="cursor:pointer"><td>${p.code}</td><td><b>${esc(p.title)}</b></td><td class="rating">${p.rating}</td><td>${p.tags.split(',').map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</td></tr>`).join('')}</tbody></table></div></section>`}
function contestCard(c){return `<div class="card contest"><div class="row between"><span class="badge ${c.phase==='upcoming'?'info':'ok'}">${c.phase}</span><span class="muted">${c.duration} min</span></div><h3>${esc(c.name)}</h3><p class="muted">${c.problems.length} problems · ${c.participants.length} registered</p><button class="btn secondary" onclick="openContest(${c.id})">View contest</button></div>`}
function problems(){return `<section class="section"><div class="row between"><div><div class="pill">PROBLEMSET</div><h1>Problems</h1><p class="muted">Pick a problem and submit your solution.</p></div><input id="search" oninput="filterProblems()" placeholder="Search title / tag / rating..." style="max-width:320px"></div><div class="grid" id="problemGrid">${db.problems.map(p=>problemCard(p)).join('')}</div></section>`}
function problemCard(p){return `<div class="card problem"><div><div class="row"><span class="pill">${p.code}</span><span class="rating">${p.rating}</span></div><h3>${esc(p.title)}</h3><div>${p.tags.split(',').map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><button class="btn" onclick="openProblem(${p.id})">Solve</button></div>`}
function filterProblems(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('problemGrid').innerHTML=db.problems.filter(p=>(p.title+' '+p.tags+' '+p.rating).toLowerCase().includes(q)).map(problemCard).join('')||`<div class="empty">No problems found.</div>`}

function contests(){return `<section class="section"><div class="row between"><div><div class="pill">ARENA</div><h1>Contests</h1><p class="muted">Register, compete and climb the leaderboard.</p></div>${isAdmin()?'<button class="btn" onclick="adminAddContest()">＋ Create contest</button>':''}</div><div class="grid">${db.contests.map(contestCard).join('')}</div></section>`}
function openContest(id){selectedContest=id;page='contest';render()}
function contestPage(){let c=db.contests.find(x=>x.id===selectedContest);if(!c)return '';let joined=c.participants.includes(me()?.id);return `<section class="section"><button class="ghost" onclick="go('contests')">← Contests</button><div class="card" style="margin-top:12px"><div class="row between"><div><span class="badge ${c.phase==='upcoming'?'info':'ok'}">${c.phase}</span><h1>${esc(c.name)}</h1><p class="muted">${c.duration} minutes · starts ${new Date(c.start).toLocaleString()}</p></div>${me()?`<button class="btn" onclick="registerContest(${c.id})">${joined?'Registered ✓':'Register'}</button>`:''}</div><hr style="border-color:var(--border);border-width:1px 0 0;margin:22px 0"><h2>Problems</h2>${c.problems.map(id=>{let p=db.problems.find(x=>x.id===id);return `<div class="card problem" style="margin:8px 0"><div><b>${p.code}. ${esc(p.title)}</b><span class="rating" style="margin-left:12px">${p.rating}</span></div><button class="btn secondary" onclick="openProblem(${p.id})">Open</button></div>`}).join('')}</div></section>`}
function registerContest(id){if(!me())return openAuth('login');let c=db.contests.find(x=>x.id===id);if(!c.participants.includes(me().id)){c.participants.push(me().id);save();toast('Registered for contest ✓');render()}else toast('You are already registered.')}
function standings(){let users=[...db.users].sort((a,b)=>b.rating-a.rating);return `<section class="section"><div class="pill">GLOBAL RANKING</div><h1>Standings</h1><div class="card table-wrap"><table><thead><tr><th>Rank</th><th>Handle</th><th>Rating</th><th>Solved</th><th>Role</th></tr></thead><tbody>${users.map((u,i)=>`<tr><td><b>#${i+1}</b></td><td>⚡ ${esc(u.handle)}</td><td class="rating">${u.rating}</td><td>${u.solved}</td><td>${u.role}</td></tr>`).join('')}</tbody></table></div></section>`}
function submissions(){let arr=[...db.submissions].reverse();return `<section class="section"><div class="pill">JUDGE QUEUE</div><h1>Submissions</h1><div class="card table-wrap"><table><thead><tr><th>ID</th><th>User</th><th>Problem</th><th>Verdict</th><th>Language</th><th>Time</th></tr></thead><tbody>${arr.map(s=>{let u=db.users.find(x=>x.id===s.user),p=db.problems.find(x=>x.id===s.problem);return `<tr><td>#${s.id}</td><td>${esc(u?.handle||'?')}</td><td>${p?.code}. ${esc(p?.title||'?')}</td><td><span class="badge ${s.verdict==='Accepted'?'ok':'wa'}">${s.verdict}</span></td><td>${s.lang}</td><td>${s.time}</td></tr>`}).join('')}</tbody></table></div></section>`}
function profile(){let u=me();if(!u)return '';let solved=db.submissions.filter(s=>s.user===u.id&&s.verdict==='Accepted').map(s=>s.problem);let unique=[...new Set(solved)];return `<section class="section"><div class="grid2"><div class="card"><div class="pill">PROFILE</div><h1>${esc(u.handle)}</h1><div class="stat rating">${u.rating}</div><div class="muted">rating</div><div class="row" style="margin-top:15px"><span class="pill">${unique.length} solved</span><span class="pill">${u.role}</span></div></div><div class="card"><h2>Rating progress</h2><div style="height:130px;display:flex;align-items:end;gap:7px">${[.35,.45,.5,.62,.58,.74,.8,1].map((x,i)=>`<div style="flex:1;height:${x*100}%;border-radius:8px 8px 2px 2px;background:linear-gradient(var(--primary),var(--primary2))"></div>`).join('')}</div></div></div></section>`}

function openProblem(id){selectedProblem=id;page='problem';render()}
function problemPage(){let p=db.problems.find(x=>x.id===selectedProblem);if(!p)return '';return `<section class="section"><button class="ghost" onclick="go('problems')">← Problemset</button><div class="grid2" style="margin-top:12px"><article class="card"><div class="row"><span class="pill">${p.code}</span><span class="rating">${p.rating}</span>${p.tags.split(',').map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><h1>${esc(p.title)}</h1><p style="line-height:1.8">${esc(p.statement)}</p><h3>Input</h3><p class="muted">The input format is defined by the problem statement.</p><h3>Output</h3><p class="muted">Print the required answer.</p></article><aside class="card"><h2>Submit solution</h2>${me()?`<div class="form"><select id="lang"><option>GNU C++20</option><option>Python 3</option><option>Java 21</option></select><textarea id="code" placeholder="// paste your solution here"></textarea><button class="btn" onclick="submitCode(${p.id})">Submit →</button><div class="small muted">Demo judge: submissions are simulated locally.</div></div>`:`<div class="empty">Login to submit.<br><button class="btn" onclick="openAuth('login')" style="margin-top:12px">Login</button></div>`}<div style="margin-top:20px"><h3>Recent submissions</h3>${db.submissions.filter(s=>s.user===me()?.id&&s.problem===p.id).slice(-5).reverse().map(s=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--border)"><span>${s.lang}</span><span class="badge ${s.verdict==='Accepted'?'ok':'wa'}">${s.verdict}</span></div>`).join('')||'<span class="muted">No submissions yet.</span>'}</div></aside></div></section>`}

function submitCode(pid){let code=document.getElementById('code').value.trim();if(!code)return toast('Paste your solution first.');let p=db.problems.find(x=>x.id===pid),accepted=false;
 if(code.toLowerCase().includes(p.answer)||code.length>180)accepted=Math.random()>.18;
 let s={id:Math.max(0,...db.submissions.map(x=>x.id))+1,user:me().id,problem:pid,verdict:accepted?'Accepted':'Wrong Answer',time:new Date().toLocaleString(),lang:document.getElementById('lang').value};db.submissions.push(s);
 if(accepted){let already=db.submissions.filter(x=>x.user===me().id&&x.problem===pid&&x.verdict==='Accepted').length===1;if(already){me().solved++;me().rating=Math.max(800,me().rating+Math.round(18+(p.rating-me().rating)*.035));}}
 save();toast(accepted?'Accepted ✓ Rating updated!':'Wrong Answer');render()}

function openAuth(mode){document.getElementById('modalBox').innerHTML=`<div class="row between"><h2>${mode==='login'?'Welcome back':'Create account'}</h2><button class="icon" onclick="closeModal()">×</button></div><form class="form" onsubmit="auth(event,'${mode}')">${mode==='register'?'<input id="name" placeholder="Handle" required><input id="email" type="email" placeholder="Email" required>':''}<input id="pw" type="password" placeholder="Password" required>${mode==='login'?'<div class="small muted">Demo admin: admin / admin123</div>':''}<button class="btn">${mode==='login'?'Login':'Create account'}</button></form>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function auth(e,mode){e.preventDefault();if(mode==='login'){let val=document.getElementById('pw').value;let handle=document.querySelector('#modalBox input:not([type=password])')?.value||'';
 let u=db.users.find(x=>x.handle.toLowerCase()===handle.toLowerCase()&&x.password===val);if(!u){toast('Invalid handle or password');return}current={id:u.id};localStorage.setItem('cf_session',JSON.stringify(current));closeModal();toast('Logged in ✓');render()
 }else{let h=document.getElementById('name').value.trim(),e2=document.getElementById('email').value.trim(),pw=document.getElementById('pw').value;if(db.users.some(x=>x.handle.toLowerCase()===h.toLowerCase()))return toast('Handle already exists');let u={id:Date.now(),handle:h,email:e2,password:pw,rating:800,role:'user',solved:0};db.users.push(u);save();current={id:u.id};localStorage.setItem('cf_session',JSON.stringify(current));closeModal();toast('Account created ✓');render()}}
function logout(){current=null;localStorage.removeItem('cf_session');toast('Logged out');render()}

function admin(){if(!isAdmin())return `<div class="empty">Admin access required.</div>`;return `<section class="section"><div class="pill">CONTROL CENTER</div><h1>Admin Dashboard</h1><div class="grid"><div class="card"><div class="muted">Users</div><div class="stat">${db.users.length}</div></div><div class="card"><div class="muted">Problems</div><div class="stat">${db.problems.length}</div></div><div class="card"><div class="muted">Contests</div><div class="stat">${db.contests.length}</div></div></div><div class="grid2 section"><div class="card"><div class="row between"><h2>Problems</h2><button class="btn" onclick="adminAddProblem()">＋ Add</button></div>${db.problems.map(p=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--border)"><span><b>${p.code}</b> ${esc(p.title)} <span class="rating">${p.rating}</span></span><button class="ghost" onclick="adminDeleteProblem(${p.id})">Delete</button></div>`).join('')}</div><div class="card"><div class="row between"><h2>Contests</h2><button class="btn" onclick="adminAddContest()">＋ Add</button></div>${db.contests.map(c=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--border)"><span>${esc(c.name)} <span class="pill">${c.phase}</span></span><button class="ghost" onclick="adminDeleteContest(${c.id})">Delete</button></div>`).join('')}</div></div><div class="card section"><div class="row between"><h2>Judge</h2><span class="badge ok">ONLINE</span></div><p class="muted">The local demo judge records submissions and calculates rating changes. A production judge should execute code inside an isolated sandbox.</p><button class="btn secondary" onclick="resetDemo()">Reset demo database</button></div></section>`}
function adminAddProblem(){document.getElementById('modalBox').innerHTML=`<h2>Add problem</h2><form class="form" onsubmit="createProblem(event)"><input id="pt" placeholder="Title" required><input id="pr" type="number" placeholder="Rating" value="1200" required><input id="pg" placeholder="Tags, comma separated"><textarea id="ps" placeholder="Statement"></textarea><input id="pa" placeholder="Demo accepted keyword (e.g. sum)"><button class="btn">Create</button></form>`;document.getElementById('modal').classList.add('show')}
function createProblem(e){e.preventDefault();let id=Math.max(0,...db.problems.map(x=>x.id))+1;db.problems.push({id,code:String.fromCharCode(65+db.problems.length),title:pt.value,rating:+pr.value,tags:pg.value||'implementation',statement:ps.value||'Solve the problem.',answer:pa.value||'return'});save();closeModal();toast('Problem created ✓');render()}
function adminDeleteProblem(id){if(!confirm('Delete this problem?'))return;db.problems=db.problems.filter(p=>p.id!==id);db.contests.forEach(c=>c.problems=c.problems.filter(x=>x!==id));save();render()}
function adminAddContest(){document.getElementById('modalBox').innerHTML=`<h2>Create contest</h2><form class="form" onsubmit="createContest(event)"><input id="cn" placeholder="Contest name" required><select id="cp"><option>upcoming</option><option>running</option><option>finished</option></select><input id="cd" type="number" value="120" placeholder="Duration"><input id="cs" type="datetime-local"><input id="cps" placeholder="Problem IDs: 1,2,3" value="${db.problems.slice(0,3).map(x=>x.id).join(',')}"><button class="btn">Create</button></form>`;document.getElementById('modal').classList.add('show')}
function createContest(e){e.preventDefault();let id=Math.max(0,...db.contests.map(x=>x.id))+1;db.contests.push({id,name:cn.value,phase:cp.value,duration:+cd.value,start:cs.value||new Date().toISOString(),problems:cps.value.split(',').map(Number).filter(x=>db.problems.some(p=>p.id===x)),participants:[]});save();closeModal();toast('Contest created ✓');render()}
function adminDeleteContest(id){if(!confirm('Delete this contest?'))return;db.contests=db.contests.filter(c=>c.id!==id);save();render()}
function resetDemo(){if(confirm('Reset all demo data?')){localStorage.removeItem(KEY);location.reload()}}

render();
</script>
</body>
</html>
